[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghl-mas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pydantic>=2,<3",
    "pydantic-ai-slim[google]",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = ["schemas"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

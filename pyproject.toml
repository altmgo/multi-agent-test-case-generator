[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-case-generator"
version = "0.1.0"
description = "Generate high-level test cases from normalized research datasets."
requires-python = ">=3.11"
dependencies = [
    "google-genai==3.0.0",
    "numpy",
    "pydantic==2.14.3",
    "pydantic-ai-slim[google,groq]==2.66.0",
    "python-dotenv>=1.0,<2",
    "scipy",
]

[project.scripts]
tcg = "tcg.cli:main"
evaluate = "evaluate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

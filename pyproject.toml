[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghl-mas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai==3.0.0",
    "numpy",
    "pydantic==2.14.3",
    "pydantic-ai-slim[google]==2.66.0",
    "scipy",
]

[project.scripts]
ghl-mas = "main:main"
ghl-mas-review = "human_review:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = ["human_review", "main", "model_runtime", "persistence", "schemas"]

[tool.setuptools.packages.find]
include = ["datasets", "datasets.*", "solutions", "solutions.*", "evaluation", "evaluation.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
